# MI10s 通信与屏幕掉帧修复 v2.0 —— 配置
#
# IDLE_DEFAULT_FPS：闲置/视频场景的帧率回退值（Hz）。
#   90  = 与正常档相同，完全避免掉到 22.5Hz（推荐，实测已消除掉帧与抖动）
#   60  = 更省电，但实测会与 90 档来回切换，反而更抖，不推荐
#
# AUTO_LOCK_WAKE：开机后是否自动「锁屏 -> 亮屏」一次（1=开，0=关）。
#   开机完成即尽早执行（不等待 IMS 诊断），帮助显示/刷新率状态立即归位。
#
# LOCK_WAKE_DELAY：开机完成后等待多少秒再执行上面这个动作（默认 1，越小越早）。
#
# 改完重启生效。留空或写错会回退到默认值。
IDLE_DEFAULT_FPS=90
AUTO_LOCK_WAKE=1
LOCK_WAKE_DELAY=1
